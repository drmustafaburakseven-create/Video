name: Start daily production verification
on:
  push:
    branches: [repair/daily-render-20261126]
    paths: ['.github/workflows/check-editorial-model.yml']
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resume today's saved production batch on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-video.yml --repo "$GITHUB_REPOSITORY" --ref main -f batch_date=2026-11-26
