name: Check daily editorial model availability
on:
  push:
    branches: [repair/daily-render-20261126]
    paths: ['.github/workflows/check-editorial-model.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured model without generating content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite'
          req = urllib.request.Request(url, headers={'x-goog-api-key': os.environ['GEMINI_API_KEY']})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  model = json.load(response)
                  print('Generation supported:', 'generateContent' in model.get('supportedGenerationMethods', []))
                  print('Output token limit:', model.get('outputTokenLimit'))
          except urllib.error.HTTPError as exc:
              error = json.load(exc).get('error', {})
              reasons = [d.get('reason') for d in error.get('details', []) if isinstance(d, dict)]
              for reason in ['API_KEY_INVALID','API_KEY_EXPIRED','API_KEY_SERVICE_BLOCKED','BILLING_DISABLED','SERVICE_DISABLED']:
                  if reason in reasons:
                      print(reason)
              if 'expired' in str(error.get('message', '')).lower():
                  print('Key expiry reported')
              raise SystemExit('Model lookup failed: HTTP '+str(exc.code))
          PY
