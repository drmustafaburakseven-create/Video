name: Check daily editorial model availability
on:
  push:
    branches: [repair/daily-render-20261126]
    paths: ['.github/workflows/check-editorial-model.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d2aa9a722d042a9f7e45d35e10ff6fdcfa620642
      - run: python -m unittest automation.tests.test_editorial
      - name: Check editorial request shape
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          from automation.editorial import response_schema, DEFAULT_MODELS
          model = DEFAULT_MODELS['gemini']
          cfg = {'responseJsonSchema':response_schema(3,'warm-office-60'),'responseMimeType':'application/json','temperature':0.35,'maxOutputTokens':26000}
          response = requests.post('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',headers={'x-goog-api-key':os.environ['GEMINI_API_KEY']},json={'generationConfig':cfg,'contents':[{'parts':[{'text':'Return an empty scripts list with blocked_reason test.'}]}]},timeout=90)
          if not response.ok:
              error = response.json().get('error', {})
              msg = error.get('message','').replace(os.environ['GEMINI_API_KEY'],'[redacted]')
              raise SystemExit('Schema check HTTP '+str(response.status_code)+' '+msg[:2000])
          print('Schema accepted')
          PY
