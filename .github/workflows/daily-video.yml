name: Daily motion video

on:
  schedule:
    # Turkey remains UTC+3: 06:00 UTC = 09:00 Europe/Istanbul.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      plan:
        description: 'Optional plan filename, e.g. ek-gida-baslangic.json; blank uses the queue'
        required: false
        type: string
      validate_only:
        description: 'Check the plans without spending provider credits'
        type: boolean
        default: false

permissions:
  contents: write # Persist paid-operation receipts on video-automation-state, never on main.

concurrency:
  group: daily-motion-video
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r automation/requirements.txt
      - name: Validate plans
        run: python -m automation.pipeline --validate
      - name: Generate the next motion video
        if: ${{ !inputs.validate_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          VEO_MODEL: ${{ vars.VEO_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          USE_CLAUDE_DIRECTOR: ${{ vars.USE_CLAUDE_DIRECTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PLAN: ${{ inputs.plan }}
        run: |
          args=()
          if [ -n "$INPUT_PLAN" ]; then args+=(--plan "$INPUT_PLAN"); fi
          python -m automation.pipeline "${args[@]}"
      - name: Upload video and recovery assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-video-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            video-output/status.json
            video-output/*/video.mp4
            video-output/*/shot-*.mp4
            video-output/*/voice.mp3
            video-output/*/captions.*
            video-output/*/narration.txt
            video-output/*/sources.txt
            video-output/*/plan.json
            video-output/*/validation.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Write run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('video-output/status.json')
          result = json.loads(p.read_text()) if p.exists() else {'status': 'validation/setup only'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Günlük hareketli video\n\n')
              f.write('Saat: 09.00 Türkiye (06.00 UTC).\n\n')
              f.write('```json\n' + json.dumps(result, ensure_ascii=False, indent=2) + '\n```\n\n')
              f.write('MP4 ve altyazılar bu çalıştırmanın **Artifacts** bölümündedir.\n')
              f.write('Kurulum ve kurtarma: `automation/README.md`.\n')
          PY
