name: Daily motion video — 3 Reels + Shorts copy

on:
  push:
    # An explicit release-style trigger for starting a requested render via Git.
    tags: ['render-video-*']
  release:
    types: [published]
  schedule:
    # Turkey remains UTC+3: 06:00 UTC = 09:00 Europe/Istanbul.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      batch_date:
        description: 'Optional date of an existing daily batch (YYYY-MM-DD)'
        required: false
        type: string
      plan:
        description: 'Legacy plan filename; blank runs three warm-office video slots and social copy. Prepare accepts drafts.'
        required: false
        type: string
      validate_only:
        description: 'Check the plans without spending provider credits'
        type: boolean
        default: false
      prepare_only:
        description: 'Export narration and avatar audio slices only (requires plan filename; may use TTS credits)'
        type: boolean
        default: false
      editorial_only:
        description: 'Five topics, three scripts and Reels/Shorts copy; no video (leave plan blank)'
        type: boolean
        default: false

permissions:
  contents: write # Persist paid-operation receipts on video-automation-state, never on main.

concurrency:
  group: daily-motion-video
  cancel-in-progress: false

jobs:
  produce:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'reels-') }}
    name: Senaryolar ve hazır medya paketlerinin kurgusu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r automation/requirements.txt
      - name: Validate plans
        run: python -m automation.pipeline --validate
      - name: Restore licensed stock footage
        if: ${{ inputs.plan && !inputs.validate_only && !inputs.prepare_only && !inputs.editorial_only }}
        run: python -m automation.restore_media
      - name: Generate the next motion video
        if: ${{ !inputs.validate_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          VEO_MODEL: ${{ vars.VEO_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          USE_CLAUDE_DIRECTOR: ${{ vars.USE_CLAUDE_DIRECTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_DATE: ${{ inputs.batch_date }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REELS_MEDIA_KEY: ${{ secrets.REELS_MEDIA_KEY }}
          INPUT_PLAN: ${{ inputs.plan }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          EDITORIAL_ONLY: ${{ inputs.editorial_only }}
          EDITORIAL_PROVIDER: ${{ vars.EDITORIAL_PROVIDER || 'gemini' }}
        run: |
          if [ -n "$INPUT_PLAN" ] || [ "$PREPARE_ONLY" = "true" ]; then
            args=()
            if [ -n "$INPUT_PLAN" ]; then args+=(--plan "$INPUT_PLAN"); fi
            if [ "$PREPARE_ONLY" = "true" ]; then args+=(--prepare); fi
            python -m automation.pipeline "${args[@]}"
          else
            case "$EDITORIAL_PROVIDER" in
              gemini|claude) ;;
              *) echo 'Hosted workflow supports EDITORIAL_PROVIDER=gemini or claude. Claude Code subscription login requires a configured persistent worker.'; exit 2 ;;
            esac
            args=(--videos 3 --provider "$EDITORIAL_PROVIDER" --hosted-releases)
            if [ -n "$RELEASE_TAG" ]; then
              if [[ "$RELEASE_TAG" =~ ^reels-([0-9]{4}-[0-9]{2}-[0-9]{2})-[a-z0-9][a-z0-9-]{0,63}$ ]]; then
                BATCH_DATE="${BASH_REMATCH[1]}"
              else
                echo 'Bu etiket günlük medya paketi değil.'
                exit 0
              fi
            fi
            if [ -n "$BATCH_DATE" ]; then args+=(--date "$BATCH_DATE" --resume-only); fi
            if [ "$EDITORIAL_ONLY" = "true" ]; then args+=(--editorial-only); fi
            # The warm-office queue uses reviewed ready.json packages. It does
            # not fall back to the legacy Fal/eight-second-avatar layout.
            python -m automation.batch_studio "${args[@]}"
          fi
      - name: Upload video and recovery assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motion-video-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            video-output/status.json
            video-output/production-status.json
            video-output/studio/*/status.json
            video-output/studio/*/daily.json
            video-output/studio/*/daily.md
            video-output/studio/*/*.editorial.json
            video-output/studio/*/compiled-plan.json
            video-output/studio/*/*/social.json
            video-output/studio/*/*/reels.txt
            video-output/studio/*/*/shorts.txt
            video-output/studio/*/*/paylasim.md
            video-output/warm-studio/*/status.json
            video-output/warm-studio/*/*/sonuc.gpg
            video-output/warm-studio/*/*/video.mp4
            video-output/warm-studio/*/*/delivery.json
            video-output/warm-studio/*/*/social.json
            video-output/warm-studio/*/*/reels.txt
            video-output/warm-studio/*/*/shorts.txt
            video-output/warm-studio/*/*/paylasim.md
            video-output/*/video.mp4
            video-output/*/shot-*.mp4
            video-output/*/generated-*.mp4
            video-output/*/avatar-*-speech.wav
            video-output/*/avatar-requests.json
            video-output/*/voice.mp3
            video-output/*/alignment.json
            video-output/*/voice-manifest.json
            video-output/*/captions.*
            video-output/*/narration.txt
            video-output/*/sources.txt
            video-output/*/plan.json
            video-output/*/validation.json
            video-output/*/budget.json
            video-output/*/delivery.json
            video-output/*/production.json
            video-output/*/social.json
            video-output/*/reels.txt
            video-output/*/shorts.txt
            video-output/*/paylasim.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Write run summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('video-output/status.json')
          result = json.loads(p.read_text()) if p.exists() else {'status': 'validation/setup only'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Günlük hareketli video\n\n')
              if result.get('status') == 'awaiting_media':
                  f.write(f"**Medya bekleniyor · {result['completed_videos']}/{result['requested_videos']} video hazır.**\\n\\n")
              f.write('Saat: 09.00 Türkiye (06.00 UTC).\n\n')
              f.write('```json\n' + json.dumps(result, ensure_ascii=False, indent=2) + '\n```\n\n')
              f.write('Başarılı üretimde MP4 ve altyazılar **Artifacts** bölümündedir. `needs_inputs` ise incelenmiş ses/görüntü/grafik paketlerini tamamlayın.\n')
              f.write('Plan boşken: beş konu, üç senaryo ve ayrı Reels/Shorts metinleri. İncelenmiş sıcak-ofis kurgu paketleri varsa üç 60 saniyelik video. Yeni avatar/medya paketlerinin hazırlanması ayrı adımdır. Otomatik yayın yapılmaz.\n')
              f.write('Kurulum ve kurtarma: `automation/README.md`.\n')
          # A small, credential-free receipt makes the job status available with
          # the same Git repository access used to submit the render request.
          from automation.state import GitHubJournal
          try:
              journal = GitHubJournal(os.environ['GITHUB_REPOSITORY'],
                                      os.environ['GITHUB_TOKEN'], os.environ['GITHUB_SHA'])
              journal.load('latest-run')
              journal.save('latest-run', {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'commit': os.environ['GITHUB_SHA'],
                  'result': result,
              })
          except Exception as exc:
              print('Run receipt could not be saved (' + type(exc).__name__ + ').')
          PY
