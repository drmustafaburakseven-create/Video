name: Video automation checks

on:
  pull_request:
    paths: ['automation/**', '.github/workflows/*video*.yml']
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/*video*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r automation/requirements.txt
      - run: python -m unittest discover -s automation/tests -v
      - run: python -m automation.pipeline --validate
