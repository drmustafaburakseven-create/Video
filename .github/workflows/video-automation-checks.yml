name: Video automation checks

on:
  pull_request:
    paths: ['automation/**', '.github/workflows/*video*.yml']
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/*video*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r automation/requirements.txt pytest==9.1.1
      - run: python -m pytest automation/tests -v
      - run: python -m automation.pipeline --validate
